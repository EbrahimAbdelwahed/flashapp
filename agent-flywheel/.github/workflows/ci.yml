name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Verify pinned harness contract
        run: >-
          python -c "from study_agent.feedback.outbox import OUTBOX_SCHEMA_VERSION;
          assert OUTBOX_SCHEMA_VERSION == 2"
      - name: Verify pinned harness provenance
        run: >-
          python -c "import importlib.metadata as m, json;
          d=m.distribution('study-agent-harness').read_text('direct_url.json');
          v=json.loads(d or '{}').get('vcs_info', {});
          assert v.get('commit_id') == 'e74c4da9c737f97dd460c606dbb7afcc66137b84'"
      - name: Test
        run: python -m pytest
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Install flywheel smoke dependencies
        if: matrix.python-version == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Flywheel scaffold and runner smoke
        if: matrix.python-version == '3.13'
        run: scripts/check-flywheel.sh
      - name: Build wheel
        run: python -m build
      - name: Clean wheel import
        run: |
          python -m venv /tmp/study-agent-devkit-wheel
          /tmp/study-agent-devkit-wheel/bin/python -m pip install dist/*.whl
          /tmp/study-agent-devkit-wheel/bin/python -c "from study_agent_devkit.capability_gap import SQLiteCapabilityGapStore; from study_agent.feedback.outbox import OUTBOX_SCHEMA_VERSION; assert OUTBOX_SCHEMA_VERSION == 2"
